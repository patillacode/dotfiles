<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--__TITLE__--></title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
<style>
:root {
  --bg: #f6f3ec; --surface: #ede8dc; --border: #d9d2c2;
  --text: #2d2a26; --muted: #6b6558; --accent: #5e6ad2;
  --high-bg: #f7e3df; --high-fg: #8a2a1d;
  --med-bg: #f6ecd6; --med-fg: #8a5d1d;
  --low-bg: #e2e6f2; --low-fg: #3a4a7a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1f2024; --surface: #2a2c32; --border: #3a3d44;
    --text: #e6e3dc; --muted: #a3a097; --accent: #8b95e8;
    --high-bg: #3a2622; --high-fg: #f0a89c;
    --med-bg: #3a3422; --med-fg: #e8c98c;
    --low-bg: #262b3a; --low-fg: #aeb8e0;
  }
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  max-width: 820px; margin: 2.5rem auto; padding: 0 1.5rem;
}
h1 { font-size: 1.6rem; line-height: 1.3; margin-bottom: 0.25rem; }
.meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-size: 0.85em; }
pre { background: var(--surface); padding: 1rem; border-radius: 6px; overflow-x: auto; border: 1px solid var(--border); margin: 0.75rem 0; }

.summary { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.5rem 0; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.9rem; font-size: 0.9rem; }
.stat strong { font-size: 1.1rem; }

.filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 2rem; }
.chip {
  cursor: pointer; user-select: none; font-size: 0.8rem; font-weight: 600;
  padding: 0.3rem 0.75rem; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
}
.chip[aria-pressed="false"] { opacity: 0.4; }
.chip.high { background: var(--high-bg); color: var(--high-fg); border-color: transparent; }
.chip.medium { background: var(--med-bg); color: var(--med-fg); border-color: transparent; }
.chip.low { background: var(--low-bg); color: var(--low-fg); border-color: transparent; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.75rem; overflow: hidden; }
.card.hidden { display: none; }
.card-head { display: flex; align-items: center; gap: 0.6rem; padding: 0.9rem 1.1rem; cursor: pointer; }
.card-head:hover { background: rgba(127,127,127,0.06); }
.card-head .title { font-weight: 600; flex: 1; }
.card-head .loc { color: var(--muted); font-size: 0.82rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.card-body { padding: 0 1.1rem 1.1rem; display: none; }
.card.open .card-body { display: block; }
.card.open .chevron { transform: rotate(90deg); }
.chevron { color: var(--muted); transition: transform 0.15s; }

.sev { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.03em; padding: 0.12rem 0.5rem; border-radius: 999px; }
.sev.high { background: var(--high-bg); color: var(--high-fg); }
.sev.medium { background: var(--med-bg); color: var(--med-fg); }
.sev.low { background: var(--low-bg); color: var(--low-fg); }
.src { font-size: 0.7rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0.1rem 0.45rem; }

.field-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 1rem 0 0.3rem; }
.mr { position: relative; border-left: 3px solid var(--accent); padding: 0.5rem 1rem; color: var(--muted); font-style: italic; background: rgba(94,106,210,0.06); border-radius: 0 6px 6px 0; }
.copy-btn { position: absolute; top: 0.4rem; right: 0.4rem; font-size: 0.72rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 5px; padding: 0.2rem 0.5rem; font-style: normal; }
.copy-btn:hover { border-color: var(--accent); }
.empty { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<h1><!--__TITLE__--></h1>
<div class="meta"><!--__META__--></div>

<div class="summary" id="summary"></div>
<div class="filters" id="filters"></div>
<div id="findings"></div>

<script>
const FINDINGS = /*__FINDINGS__*/[];

const SEVS = ["HIGH", "MEDIUM", "LOW"];
const active = { HIGH: true, MEDIUM: true, LOW: true, manual: true, coderabbit: true, both: true };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderSummary() {
  const by = s => FINDINGS.filter(f => f.severity === s).length;
  const src = s => FINDINGS.filter(f => f.source === s || (s !== "both" && f.source === "both")).length;
  document.getElementById("summary").innerHTML = `
    <div class="stat"><strong>${FINDINGS.length}</strong> total</div>
    <div class="stat"><strong>${by("HIGH")}</strong> high</div>
    <div class="stat"><strong>${by("MEDIUM")}</strong> medium</div>
    <div class="stat"><strong>${by("LOW")}</strong> low</div>
    <div class="stat"><strong>${src("manual")}</strong> manual</div>
    <div class="stat"><strong>${src("coderabbit")}</strong> CodeRabbit</div>`;
}

function renderFilters() {
  const wrap = document.getElementById("filters");
  const chips = [
    ...SEVS.map(s => ({ key: s, label: s, cls: s.toLowerCase() })),
    { key: "manual", label: "manual" }, { key: "coderabbit", label: "CodeRabbit" }, { key: "both", label: "flagged by both" },
  ];
  wrap.innerHTML = chips.map(c =>
    `<span class="chip ${c.cls || ""}" data-key="${c.key}" aria-pressed="true">${esc(c.label)}</span>`).join("");
  wrap.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
    const k = chip.dataset.key;
    active[k] = !active[k];
    chip.setAttribute("aria-pressed", active[k]);
    applyFilters();
  }));
}

function applyFilters() {
  document.querySelectorAll(".card").forEach(card => {
    const sev = card.dataset.sev, src = card.dataset.src;
    card.classList.toggle("hidden", !(active[sev] && active[src]));
  });
}

function renderFindings() {
  const root = document.getElementById("findings");
  if (!FINDINGS.length) {
    root.innerHTML = `<div class="empty">No findings — the diff looks clean. ✨</div>`;
    return;
  }
  root.innerHTML = FINDINGS.map((f, i) => {
    const sevCls = f.severity.toLowerCase();
    const srcLabel = f.source === "both" ? "flagged by both" : f.source;
    const snippet = f.snippet && f.snippet.code
      ? `<div class="field-label">Snippet</div><pre><code class="language-${esc(f.snippet.lang || "none")}">${esc(f.snippet.code)}</code></pre>` : "";
    return `
    <div class="card" data-sev="${f.severity}" data-src="${esc(f.source)}">
      <div class="card-head" onclick="this.parentNode.classList.toggle('open')">
        <span class="chevron">▶</span>
        <span class="sev ${sevCls}">${esc(f.severity)}</span>
        <span class="title">${esc(f.title)}</span>
        <span class="src">${esc(srcLabel)}</span>
        <span class="loc">${esc(f.file)}:${esc(f.lines)}</span>
      </div>
      <div class="card-body">
        <div class="field-label">Summary</div><div>${esc(f.summary)}</div>
        <div class="field-label">Explanation</div><div>${esc(f.explanation)}</div>
        ${snippet}
        <div class="field-label">MR comment</div>
        <div class="mr">
          <button class="copy-btn" data-i="${i}">Copy</button>
          ${esc(f.mrComment)}
        </div>
      </div>
    </div>`;
  }).join("");
  root.querySelectorAll(".copy-btn").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    navigator.clipboard.writeText(FINDINGS[btn.dataset.i].mrComment).then(() => {
      const t = btn.textContent; btn.textContent = "Copied!"; setTimeout(() => btn.textContent = t, 1200);
    });
  }));
  if (window.Prism) Prism.highlightAll();
}

renderSummary();
renderFilters();
renderFindings();
</script>
</body>
</html>
